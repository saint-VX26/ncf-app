<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Screen</title><link rel="stylesheet" href="/style.css">
  <style>
    body { cursor: none; background: #000; overflow: hidden; margin: 0; }
    
    video { 
      width: 100vw; height: 100vh; object-fit: contain; 
      position: absolute; top: 0; left: 0; 
      z-index: 9999; background: #000;
    }

    .overlay { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.85); 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      z-index: 10; transition: background 0.3s;
    }
  </style>
</head>
<body>
  <div id="setupOverlay" class="overlay">
    <h1>Screen Setup</h1>
    <input type="file" id="videoFile" accept="video/*" style="margin: 1rem; color: white; padding: 10px; background: #333; border-radius: 5px;">
    <button id="armBtn" class="btn btn-green" disabled>Arm the screen</button>
    <p style="color: #aaa; margin-top: 10px;">Press <b>S</b> for local 30s backup countdown.</p>
  </div>
  
  <div id="timerOverlay" class="overlay hidden">
    <h2 id="screenStatus">Get Ready</h2>
    
    <div class="timer-grid">
      <div id="box-m" class="time-box">
        <div id="t-m" class="time-num">00</div>
        <div class="time-label">Minutes</div>
      </div>
      <div id="box-s" class="time-box">
        <div id="t-s" class="time-num">00</div>
        <div class="time-label">Seconds</div>
      </div>
    </div>
  </div>
  
  <video id="trailerVideo" class="hidden" playsinline></video>
  
  <script src="/sync.js"></script>
  <script>
    const video = document.getElementById('trailerVideo');
    const setupOverlay = document.getElementById('setupOverlay');
    const timerOverlay = document.getElementById('timerOverlay');
    const boxM = document.getElementById('box-m');
    const boxS = document.getElementById('box-s');
    const tM = document.getElementById('t-m');
    const tS = document.getElementById('t-s');
    const screenStatus = document.getElementById('screenStatus');
    const videoFile = document.getElementById('videoFile');
    const armBtn = document.getElementById('armBtn');
    
    let currentState = null;
    let isArmed = false;
    let localBackup = false;
    let localTarget = null;
    let timerInterval = null;
    let videoIsPlaying = false;
    let lastBeepSecond = -1;

    // SOUND GENERATOR
    let audioCtx = null;
    function playSound(type) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'tick') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'boom') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
        osc.start(); osc.stop(audioCtx.currentTime + 1);
      }
    }

    videoFile.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        video.src = URL.createObjectURL(e.target.files[0]);
        video.load(); armBtn.disabled = false;
      }
    });

    armBtn.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      setupOverlay.classList.add('hidden');
      isArmed = true;
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
      startTimerLoop();
    });

    syncClock().then(() => {
      connectSSE('screen', (s) => {
        if (videoIsPlaying) return; 
        currentState = s;
        if (isArmed && !localBackup) {
          if (s.phase === 'running') {
            timerOverlay.classList.remove('hidden');
            video.classList.add('hidden'); video.pause();
            if (!timerInterval) startTimerLoop();
          } else {
            timerOverlay.classList.add('hidden');
            timerOverlay.classList.remove('warning-pulse');
            boxM.classList.remove('warning-box'); boxS.classList.remove('warning-box');
            tM.classList.remove('warning-text'); tS.classList.remove('warning-text');
            video.classList.add('hidden'); video.pause();
          }
        }
      });
    });

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isArmed || videoIsPlaying) return;

        if (localBackup && localTarget) {
          const remaining = localTarget - Date.now();
          if (remaining <= 0) { playTrailer(); localBackup = false; }
          else updateDisplay(remaining);
          return;
        }

        if (currentState && currentState.phase === 'running') {
          const remaining = currentState.target - getServerNow();
          if (remaining <= 0) playTrailer();
          else if (video.classList.contains('hidden')) updateDisplay(remaining);
        }
      }, 100);
    }

    function updateDisplay(remaining) {
      const totalSecs = remaining <= 0 ? 0 : Math.ceil(remaining / 1000);
      const m = Math.floor(totalSecs / 60);
      const s = totalSecs % 60;
      
      tM.textContent = String(m).padStart(2, '0');
      tS.textContent = String(s).padStart(2, '0');

      if (remaining <= 10000 && remaining > 0) {
        timerOverlay.classList.add('warning-pulse');
        boxM.classList.add('warning-box'); boxS.classList.add('warning-box');
        tM.classList.add('warning-text'); tS.classList.add('warning-text');
        
        const currentSecond = Math.ceil(remaining / 1000);
        if (currentSecond !== lastBeepSecond) {
          lastBeepSecond = currentSecond;
          playSound('tick');
        }
      } else {
        timerOverlay.classList.remove('warning-pulse');
        boxM.classList.remove('warning-box'); boxS.classList.remove('warning-box');
        tM.classList.remove('warning-text'); tS.classList.remove('warning-text');
      }
    }

    function playTrailer() {
      if (videoIsPlaying) return;
      videoIsPlaying = true;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (timerOverlay) timerOverlay.remove(); 
      playSound('boom');
      
      video.classList.remove('hidden'); video.style.display = 'block';
      video.play().catch(() => {
        const prompt = document.createElement('div');
        prompt.className = 'overlay';
        prompt.innerHTML = '<h1 style="color: white; z-index: 10000; position: absolute;">Click anywhere to play!</h1>';
        document.body.appendChild(prompt);
        document.addEventListener('click', () => { video.play(); prompt.remove(); }, { once: true });
      });
    }

    document.addEventListener('keydown', (e) => {
      if (videoIsPlaying) return; 
      if (e.key.toLowerCase() === 's' && isArmed) {
        localBackup = true; localTarget = Date.now() + 30000;
        if (timerOverlay && document.body.contains(timerOverlay)) timerOverlay.classList.remove('hidden');
        video.classList.add('hidden'); video.pause(); startTimerLoop();
      }
      if (e.key.toLowerCase() === 'c') {
        localBackup = false; localTarget = null;
        if (timerOverlay && document.body.contains(timerOverlay)) {
          timerOverlay.classList.add('hidden');
          timerOverlay.classList.remove('warning-pulse');
          boxM.classList.remove('warning-box'); boxS.classList.remove('warning-box');
          tM.classList.remove('warning-text'); tS.classList.remove('warning-text');
        }
        video.classList.add('hidden'); video.pause();
      }
    });
  </script>
</body>
</html>
