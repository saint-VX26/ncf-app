<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCF Carol - Scan to join</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel+Decorative:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .qr-container { background: white; padding: 2rem; border-radius: 12px; display: inline-block; margin: 2rem; }
    .qr-container img { width: 300px; height: 300px; }
    @media print {
      body { background: white; color: black; }
      .no-print { display: none; }
      .qr-container { border: 2px solid black; }
      h1, h2 { color: black; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>He Walked Where I Walk</h1>
    <h2>NCF Carol Sunday</h2>
    
    <div class="qr-container">
      <img id="qrImage" src="" alt="QR Code">
    </div>

    <h2 class="no-print">Scan to join the countdown!</h2>
    <p class="no-print" id="urlText" style="color: var(--gold);"></p>
    
    <button class="btn no-print" onclick="window.print()">Print Poster</button>
  </div>

  <script>
    async function loadQR() {
      const res = await fetch('/api/info');
      const data = await res.json();
      const url = data.join;
      document.getElementById('urlText').textContent = url;
      
      // Use an inline QR generator to avoid CDN dependency
      const qrScript = document.createElement('script');
      qrScript.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
      qrScript.onload = () => {
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        document.getElementById('qrImage').src = qr.createDataURL(8, 4);
      };
      document.head.appendChild(qrScript);
    }
    loadQR();
  </script>
</body>
</html>
