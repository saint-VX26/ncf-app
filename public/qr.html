<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to join</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background-color: #0a0505;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .qr-container { 
      background: white; 
      padding: 2rem; 
      border-radius: 12px; 
      display: inline-block; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    
    .qr-container img { 
      width: 350px; 
      height: 350px; 
      display: block;
    }

    .btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
    }

    @media print {
      body { 
        background: white !important; 
      }
      .qr-container { 
        border: 2px solid black; 
        box-shadow: none;
      }
      .no-print { 
        display: none !important; 
      }
    }
  </style>
</head>
<body>
  
  <!-- Just the QR code and its border -->
  <div class="qr-container">
    <img id="qrImage" src="" alt="QR Code">
  </div>

  <!-- The button disappears when you print -->
  <button class="btn btn-green no-print" onclick="window.print()">
    PRINT POSTER
  </button>

  <script>
    async function loadQR() {
      const res = await fetch('/api/info');
      const data = await res.json();
      const url = data.join;
      
      const qrScript = document.createElement('script');
      qrScript.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
      qrScript.onload = () => {
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        // High resolution for crisp printing
        document.getElementById('qrImage').src = qr.createDataURL(15, 4);
      };
      document.head.appendChild(qrScript);
    }
    loadQR();
  </script>
</body>
</html>
