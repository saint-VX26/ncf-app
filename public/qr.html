<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to join</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Adjust the page layout for a poster */
    body {
      background-color: #0a0505;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(120, 20, 20, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(20, 80, 30, 0.3) 0%, transparent 40%);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .poster-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(234, 179, 8, 0.4); /* Gold border */
      border-radius: 30px;
      padding: 50px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 10px;
      color: var(--gold);
      text-shadow: 0 0 20px var(--gold-glow);
    }

    h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: white;
      margin-bottom: 30px;
    }

    /* The QR Code White Box */
    .qr-box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 30px;
      box-shadow: 0 0 40px rgba(234, 179, 8, 0.2);
    }

    .qr-box img {
      width: 100%;
      max-width: 300px;
      height: auto;
      display: block;
    }

    .instructions {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .url-text {
      font-size: 0.9rem;
      color: var(--gold);
      word-break: break-all;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    /* Hide the button when printing */
    @media print {
      body {
        background: white !important;
        padding: 0;
      }
      .poster-container {
        background: white;
        border: 4px solid black;
        box-shadow: none;
        color: black;
      }
      h1 { color: black; text-shadow: none; }
      h2 { color: #333; }
      .instructions { color: #333; }
      .url-text { color: #666; }
      .btn { display: none !important; }
      .qr-box { box-shadow: none; border: 2px solid #eee; }
    }
  </style>
</head>
<body>
  
  <div class="poster-container">
    <h1>He Walked<br>Where I Walk</h1>
    <h2>NCF CAROL SUNDAY</h2>
    
    <div class="qr-box">
      <img id="qrImage" src="" alt="QR Code">
    </div>

    <div class="instructions">
      SCAN TO JOIN<br>THE COUNTDOWN
    </div>

    <div class="url-text" id="urlText"></div>
    
    <button class="btn btn-green" onclick="window.print()" style="font-size: 1.2rem; padding: 1rem 3rem;">
      PRINT POSTER
    </button>
  </div>

  <script>
    async function loadQR() {
      const res = await fetch('/api/info');
      const data = await res.json();
      const url = data.join;
      document.getElementById('urlText').textContent = url;
      
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
      script.onload = () => {
        const qr = qrcode(0, 'M');
        qr.addData(url); qr.make();
        document.getElementById('qrImage').src = qr.createDataURL(10, 4);
      };
      document.head.appendChild(script);
    }
    loadQR();
  </script>
</body>
</html>
