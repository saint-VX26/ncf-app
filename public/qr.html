<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to join</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Center everything on the screen */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0a0505;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(120, 20, 20, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(20, 80, 30, 0.3) 0%, transparent 40%);
    }

    /* The Gold Border Box */
    .poster-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(234, 179, 8, 0.6); /* The Gold Border */
      border-radius: 30px;
      padding: 50px 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }

    /* The White QR Box */
    .qr-box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 0 40px rgba(234, 179, 8, 0.2);
    }

    .qr-box img {
      width: 100%;
      max-width: 350px;
      height: auto;
      display: block;
    }

    /* Print Mode Settings */
    @media print {
      body { 
        background: white !important; 
        display: block;
      }
      .poster-container { 
        border: 4px solid black; 
        background: white; 
        box-shadow: none;
        padding: 40px;
        border-radius: 0;
      }
      .qr-box { box-shadow: none; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  
  <div class="poster-container">
    <div class="qr-box">
      <img id="qrImage" src="" alt="QR Code">
    </div>
    
    <br>
    
    <button class="btn btn-green no-print" onclick="window.print()" style="margin-top: 20px; padding: 1rem 3rem; font-size: 1.2rem;">
      PRINT POSTER
    </button>
  </div>

  <script>
    async function loadQR() {
      const res = await fetch('/api/info');
      const data = await res.json();
      const url = data.join;
      
      const qrScript = document.createElement('script');
      qrScript.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
      qrScript.onload = () => {
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        // High resolution for crisp printing
        document.getElementById('qrImage').src = qr.createDataURL(15, 4);
      };
      document.head.appendChild(qrScript);
    }
    loadQR();
  </script>
</body>
</html>
