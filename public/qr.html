<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to join</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Page layout */
    body {
      background-color: #0a0505;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(120, 20, 20, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(20, 80, 30, 0.3) 0%, transparent 40%);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .poster-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 40px;
      text-align: center;
    }

    /* The QR Code White Box */
    .qr-box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 30px;
    }

    .qr-box img {
      width: 100%;
      max-width: 400px; /* Made the QR code even bigger */
      height: auto;
      display: block;
    }

    .instructions {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 20px;
      line-height: 1.2;
    }

    /* Hide the print button and backgrounds when printing */
    @media print {
      body {
        background: white !important;
        padding: 0;
      }
      .poster-container {
        background: white;
        padding: 0;
      }
      .instructions {
        color: black;
      }
      .btn { display: none !important; }
    }
  </style>
</head>
<body>
  
  <div class="poster-container">
    <div class="qr-box">
      <img id="qrImage" src="" alt="QR Code">
    </div>

    <div class="instructions">
      SCAN TO JOIN<br>THE COUNTDOWN
    </div>
    
    <button class="btn btn-green" onclick="window.print()" style="font-size: 1.2rem; padding: 1rem 3rem;">
      PRINT POSTER
    </button>
  </div>

  <script>
    async function loadQR() {
      const res = await fetch('/api/info');
      const data = await res.json();
      const url = data.join;
      
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
      script.onload = () => {
        const qr = qrcode(0, 'M');
        qr.addData(url); qr.make();
        // Increased resolution for sharper printing
        document.getElementById('qrImage').src = qr.createDataURL(15, 4);
      };
      document.head.appendChild(script);
    }
    loadQR();
  </script>
</body>
</html>
