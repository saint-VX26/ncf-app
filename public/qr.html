<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan to join</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Page layout */
    body {
      background-color: #0a0505;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(120, 20, 20, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(20, 80, 30, 0.3) 0%, transparent 40%);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* The Gold Border Box */
    .poster-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(234, 179, 8, 0.6); /* Gold border */
      border-radius: 30px;
      padding: 60px 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
    }

    /* The QR Code White Box */
    .qr-box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 0 40px rgba(234, 179, 8, 0.2);
    }

    .qr-box img {
      width: 100%;
      max-width: 450px; /* Huge QR code for easy scanning */
      height: auto;
      display: block;
    }

    /* Hide the button and backgrounds when printing */
    @media print {
      body {
        background: white !important;
        padding: 0;
        display: block;
      }
      .poster-container {
        background: white;
        border: 4px solid black;
        border-radius: 0;
        padding: 40px;
        box-shadow: none;
      }
      .qr-box {
        box-shadow: none;
        padding: 0;
      }
      .btn { display: none !important; }
    }
  </style>
</head>
<body>
  
  <div class="poster-container">
    <div class="qr-box">
      <img id="qrImage" src="" alt="QR Code">
    </div>
    <br>
    <button class="btn btn-green" onclick="window.print()" style="font-size: 1.2rem; padding: 1rem 3rem; margin-top: 20px;">
      PRINT POSTER
    </button>
  </div>

  <script>
    async function loadQR() {
      const res = await fetch('/api/info');
      const data = await res.json();
      const url = data.join;
      
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
      script.onload = () => {
        const qr = qrcode(0, 'M');
        qr.addData(url); qr.make();
        // High resolution for crisp printing
        document.getElementById('qrImage').src = qr.createDataURL(15, 4);
      };
      document.head.appendChild(script);
    }
    loadQR();
  </script>
</body>
</html>
