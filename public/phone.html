<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCF Countdown</title><link rel="stylesheet" href="/style.css">
</head>
<body id="phoneBody">
  <div class="container">
    <h1>He Walked Where I Walk</h1>
    <h2>Sunday 29 November · 6:00 PM</h2>
    
    <div id="statusText" style="color: #aaa; font-size: 1.2rem; margin-top: 2rem;">Waiting for the countdown to start...</div>
    
    <div id="timerWrapper" class="hidden">
      <div class="timer-grid">
        <div id="box-m" class="time-box">
          <div id="t-m" class="time-num">00</div>
          <div class="time-label">Minutes</div>
        </div>
        <div id="box-s" class="time-box">
          <div id="t-s" class="time-num">00</div>
          <div class="time-label">Seconds</div>
        </div>
      </div>
    </div>

    <div id="playNotice" class="hidden" style="margin-top: 2rem;">
      <h1 style="color: var(--gold); font-size: 2.5rem; text-shadow: 0 0 20px var(--gold-glow);">LOOK UP!</h1>
      <p style="color: white; font-size: 1.2rem; margin-top: 10px;">The trailer is playing on the big screen.</p>
    </div>
  </div>
  
  <script src="/sync.js"></script>
  <script>
    const timerWrapper = document.getElementById('timerWrapper');
    const statusEl = document.getElementById('statusText');
    const noticeEl = document.getElementById('playNotice');
    const boxM = document.getElementById('box-m');
    const boxS = document.getElementById('box-s');
    const tM = document.getElementById('t-m');
    const tS = document.getElementById('t-s');
    let currentState = null;

    syncClock().then(() => {
      connectSSE('phone', (s) => {
        currentState = s;
        if (s.phase === 'running') {
          timerWrapper.classList.remove('hidden');
          statusEl.classList.add('hidden');
          noticeEl.classList.add('hidden');
        } else {
          timerWrapper.classList.add('hidden');
          statusEl.classList.remove('hidden');
          noticeEl.classList.add('hidden');
        }
      });
    });

    setInterval(() => {
      if (currentState && currentState.phase === 'running') {
        const remaining = currentState.target - getServerNow();
        if (remaining <= 0) {
          timerWrapper.classList.add('hidden');
          noticeEl.classList.remove('hidden');
        } else {
          const totalSecs = Math.ceil(remaining / 1000);
          const m = Math.floor(totalSecs / 60);
          const s = totalSecs % 60;
          
          tM.textContent = String(m).padStart(2, '0');
          tS.textContent = String(s).padStart(2, '0');
          
          if (remaining < 10000) {
             boxM.classList.add('warning-box'); boxS.classList.add('warning-box');
             tM.classList.add('warning-text'); tS.classList.add('warning-text');
          } else {
             boxM.classList.remove('warning-box'); boxS.classList.remove('warning-box');
             tM.classList.remove('warning-text'); tS.classList.remove('warning-text');
          }
        }
      }
    }, 100);
  </script>
</body>
</html>
